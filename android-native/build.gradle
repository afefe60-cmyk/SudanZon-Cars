// Top-level build file for SudanZon Cars Native Android App

buildscript {
    repositories {
        maven { url uri("local-m2") }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        maven { url uri("${rootProject.projectDir}/local-m2") }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Base (Squircle) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="180" r="140" fill="#38bdf8" opacity="0.25" />

  <!-- Dynamic Speed Arc / Swoosh -->
  <path d="M 90 340 C 150 405, 360 410, 425 320 C 370 380, 180 375, 110 325 Z" 
        fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Modern Aerodynamic Car Silhouette -->
  <g filter="url(#dropShadow)" transform="translate(6, -8)">
    <!-- Main Car Body -->
    <path d="M 125 295 
             C 125 285, 135 272, 150 270 
             L 190 266 
             C 210 235, 240 205, 275 200 
             L 340 200 
             C 375 200, 400 225, 415 255 
             L 435 268
             C 445 275, 452 285, 452 298
             L 415 298
             C 400 270, 375 250, 345 250
             C 315 250, 290 270, 275 298
             L 205 298
             C 190 270, 165 250, 135 250
             C 110 250, 85 270, 75 298 Z" 
          fill="#ffffff" />
    <!-- Windows -->
    <path d="M 215 260 L 275 212 C 290 212, 335 212, 348 212 L 380 260 Z" fill="#0284c7" />
    <!-- Wheels -->
    <circle cx="135" cy="298" r="32" fill="#0f172a" stroke="#ffffff" stroke-width="7" />
    <circle cx="135" cy="298" r="14" fill="#38bdf8" />
    <circle cx="345" cy="298" r="32" fill="#0f172a" stroke="#ffffff" stroke-width="7" />
    <circle cx="345" cy="298" r="14" fill="#38bdf8" />
  </g>
</svg>
